; Sesión del servidor válida 8 horas sin actividad (por defecto PHP usa 24 minutos).
; Con conexión intermitente, una sesión tan corta caducaría antes de poder enviar los registros
; hechos sin red, y habría que volver a iniciar sesión.
session.gc_maxlifetime = 28800
; La cookie de sesión también dura 8 h (por defecto se borra al cerrar el
; navegador). Así, si ya iniciaste sesión, puedes cerrar y reabrir la app
; sin red dentro de ese plazo y seguir con la sesión puesta.
session.cookie_lifetime = 28800
