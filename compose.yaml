services:
  web:
    build: .
    container_name: stockmaster_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: sistema_almacen
      DB_USER: stockmaster
      DB_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      # Notificaciones push (generar con: docker compose run --rm web php tools/generar_vapid.php)
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@stockmaster.local}
      STOCK_MINIMO: ${STOCK_MINIMO:-10}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: stockmaster_db
    environment:
      MYSQL_DATABASE: sistema_almacen
      MYSQL_USER: stockmaster
      MYSQL_PASSWORD: ${DB_PASSWORD:?Define DB_PASSWORD en el archivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Define MYSQL_ROOT_PASSWORD en el archivo .env}
    volumes:
      - stockmaster_db_data:/var/lib/mysql
      - ./BDv2.txt:/docker-entrypoint-initdb.d/01-init.sql:ro
    
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$${MYSQL_ROOT_PASSWORD}" --silent'
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

    restart: unless-stopped

volumes:
  stockmaster_db_data:
